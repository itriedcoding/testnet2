<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT OSINT - Cross-Platform Investigative Tool</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-skull"></i> WormGPT OSINT Tool</h1>
            <p>Cross-reference usernames/emails across Roblox, Discord, GitHub, X/Twitter, Minecraft, Instagram, Reddit, Snapchat, TikTok. Generate automated reports with potential passwords.</p>
        </header>

        <div class="search-box">
            <input type="text" id="usernameInput" placeholder="Enter username or email...">
            <button id="searchBtn"><i class="fas fa-search"></i> Investigate</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> Scraping the dark web for your prey...
            </div>
            <div class="results" id="results"></div>
        </div>

        <div class="report-section" id="reportSection" style="display: none;">
            <h2><i class="fas fa-file-pdf"></i> Investigative Report</h2>
            <div class="report-content" id="reportContent"></div>
            <button id="downloadReportBtn"><i class="fas fa-download"></i> Download Secure Report (TXT)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
